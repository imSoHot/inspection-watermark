name: Release

# 触发方式：
#   1. 推送 v* 标签（如 v1.0.0）→ 自动构建并发布 Release
#   2. 手动触发 workflow_dispatch → 只构建，产物存为 Actions artifact，不发布
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  # 与本地打包环境严格对齐：3.8.10 是 Windows 上最后一个 32 位 3.8 补丁版
  PYTHON_VERSION: "3.8.10"
  PILLOW_VERSION: "10.4.0"
  PYINSTALLER_VERSION: "5.13.2"

jobs:
  build:
    name: 构建 32 位 exe
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # changelog 需要完整提交历史与全部标签，浅克隆会导致区间为空
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 32 位 Python
        id: pysetup
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: "x86"

      - name: 诊断 Python 环境
        shell: pwsh
        run: |
          Write-Host "== which python =="
          Get-Command python -All | Select-Object -First 3 | ForEach-Object { $_.Source }
          python --version
          $bits = python -c "import struct; print(struct.calcsize('P') * 8)"
          Write-Host "interpreter bits = $bits"
          if ($bits -ne "32") { throw "[诊断] expected 32-bit interpreter, got $bits-bit" }
          python -m pip --version

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow==$env:PILLOW_VERSION" "pyinstaller==$env:PYINSTALLER_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "[安装依赖] pip install failed" }
          python -m PyInstaller --version
          if ($LASTEXITCODE -ne 0) { throw "[安装依赖] PyInstaller module not importable" }

      - name: 准备中文字体
        shell: pwsh
        continue-on-error: true
        run: |
          # windows-latest 为 Server 版，缺微软雅黑；此处尝试安装到系统字体目录。
          # 失败不影响构建：watermarker 已内置候选字体探测 + load_default 兜底。
          New-Item -ItemType Directory -Force -Path "C:\Windows\Fonts" | Out-Null
          $map = [ordered]@{
            "msyh.ttc"   = "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc"
            "msyhbd.ttc" = "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Bold.ttc"
          }
          foreach ($name in $map.Keys) {
            $dst = Join-Path "C:\Windows\Fonts" $name
            try {
              Invoke-WebRequest -Uri $map[$name] -OutFile $dst -TimeoutSec 180 -ErrorAction Stop
              Write-Host "OK  $name ($((Get-Item $dst).Length / 1MB -as [int]) MB)"
            } catch {
              Write-Warning "字体 $name 安装失败：$($_.Exception.Message)"
            }
          }
          Write-Host "--- C:\Windows\Fonts 中的 msyh* ---"
          Get-ChildItem "C:\Windows\Fonts" -Filter "msyh*" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table

      - name: 运行回归测试
        shell: pwsh
        run: |
          Write-Host "可用中文字体：" -NoNewline
          $f = Get-ChildItem "C:\Windows\Fonts" -Filter "msyh*" -ErrorAction SilentlyContinue
          if ($f) { Write-Host ($f.Name -join ", ") } else { Write-Host "无（将使用兜底字体，仅影响预览字形）" }
          $failed = @()
          foreach ($t in @("test_v3.py", "test_wrap.py", "test_align.py", "test_daytime.py")) {
            Write-Host "`n=== $t ==="
            python $t
            if ($LASTEXITCODE -ne 0) { $failed += $t }
          }
          if ($failed.Count -gt 0) { throw "失败用例: $($failed -join ', ')" }
          Write-Host "`n全部回归测试通过"

      - name: PyInstaller 打包
        shell: pwsh
        working-directory: pack_build
        run: |
          # 用 python -m PyInstaller，避免 Scripts 目录未进 PATH 导致命令找不到
          python -m PyInstaller --noconfirm --clean `
            --distpath gui_dist32 `
            --workpath build_tmp `
            "spec/巡检加水印.spec"
          if (-not (Test-Path "gui_dist32/巡检加水印.exe")) {
            Get-ChildItem -Recurse -Filter "*.exe" | Select-Object FullName
            throw "打包未产出 exe"
          }

      - name: 校验产物为 32 位 PE
        shell: pwsh
        run: |
          $exe = "pack_build/gui_dist32/巡检加水印.exe"
          if (-not (Test-Path $exe)) { throw "未找到打包产物 $exe" }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host ("machine = 0x{0:X}" -f $machine)
          if ($machine -ne 0x14c) { throw "产物不是 32 位 PE（machine=0x$($machine.ToString('X')))" }
          Write-Host ("大小: {0:N2} MB" -f ((Get-Item $exe).Length / 1MB))

      - name: 组装交付目录
        shell: pwsh
        run: |
          $dist = "pack_build/安装包/巡检照片加水印工具"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          if (-not (Test-Path "$dist/使用说明.txt")) { throw "缺少 pack_build/安装包/巡检照片加水印工具/使用说明.txt" }
          Copy-Item "pack_build/gui_dist32/巡检加水印.exe" "$dist/巡检加水印.exe" -Force
          Get-ChildItem $dist | Format-Table Name, Length

      - name: 生成安装包 zip
        shell: pwsh
        working-directory: pack_build
        run: |
          python make_zip.py
          if ($LASTEXITCODE -ne 0) { throw "[生成zip] make_zip.py failed" }
          # 附带一个 ASCII 文件名副本：action-gh-release 上传时中文名会被截断成 _.zip
          Copy-Item "巡检照片加水印工具_安装包.zip" "inspection-watermark-win32.zip" -Force
          Get-ChildItem *.zip | Select-Object Name, Length | Format-Table

      - name: 上传构建产物（手动触发时可用）
        uses: actions/upload-artifact@v4
        with:
          name: inspection-watermark-win32
          path: pack_build/inspection-watermark-win32.zip
          retention-days: 30

      - name: 生成中文 changelog
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # 取当前标签之外、创建时间最近的一个标签作为对比基线
          $all = git tag --sort=-creatordate
          $prev = ($all | Where-Object { $_ -ne "${{ github.ref_name }}" }) | Select-Object -First 1
          if ($prev) {
            Write-Host "对比基线: $prev -> ${{ github.ref_name }}"
            $env:PREV_TAG = $prev
          } else {
            Write-Host "无历史标签，首次发布将汇总全部提交"
            $env:PREV_TAG = ""
          }
          $env:NEW_TAG = "${{ github.ref_name }}"
          $env:GITHUB_REPOSITORY = "${{ github.repository }}"
          python .github/scripts/gen_changelog.py --out CHANGELOG_BODY.md
          if ($LASTEXITCODE -ne 0) { throw "[changelog] 生成失败" }
          if (-not (Test-Path CHANGELOG_BODY.md)) { throw "[changelog] 未产出 CHANGELOG_BODY.md" }
          Write-Host "--- 生成的 changelog ---"
          Get-Content CHANGELOG_BODY.md -Encoding UTF8

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG_BODY.md
          files: |
            pack_build/inspection-watermark-win32.zip
